plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mthtamim.smartdialer'
    compileSdk 34

    defaultConfig {
        applicationId "com.mthtamim.smartdialer"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
    }

    // 2026-11-09: the debug keystore is stored base64-encoded in
    // debug.keystore.b64 (the snapshot push cannot carry binary
    // files); decode it at build time so signingConfigs below can
    // use it. The decoded file is never committed.
    def debugKeystoreFile = file("debug.keystore")
    if (!debugKeystoreFile.exists()) {
        def b64File = file("debug.keystore.b64")
        if (b64File.exists()) {
            debugKeystoreFile.bytes =
                b64File.text.replaceAll("\\s", "").decodeBase64()
        }
    }

    signingConfigs {
        // 2026-11-09: ONE fixed debug key for every build. This keystore is
        // a DEBUG-only key (same DN/passwords as Android's default debug
        // key); it is not a release key and must never sign a release.
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
}
